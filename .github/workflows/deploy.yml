
name: Deploy React Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build React project
        env:
          BASE_PATH: /Daria.t.tour/
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Fix prerender output location
        run: |
          # обход ошибки React Router: страницы лежат во вложенной папке basename
          if [ -d "build/client/Daria.t.tour" ]; then
            cp -r build/client/Daria.t.tour/. build/client/
            rm -rf build/client/Daria.t.tour
          fi
          # на всякий случай: чтобы корень сайта всегда открывался
          if [ ! -f build/client/index.html ] && [ -f build/client/__spa-fallback.html ]; then
            cp build/client/__spa-fallback.html build/client/index.html
          fi

      - name: Inspect generated files
        if: always()
        run: |
          echo "BUILD FILES:"
          find build -maxdepth 3 -type f | sort || true
          echo "BUILD LOG:"
          cat build.log || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/client

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
