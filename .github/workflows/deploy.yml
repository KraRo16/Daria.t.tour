
name: Deploy React Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check project configuration
        run: |
          echo "CURRENT DIRECTORY:"
          pwd
          echo "ROOT FILES:"
          ls -la
          echo "VITE CONFIG:"
          cat vite.config.ts
          echo "PACKAGE:"
          cat package.json
          echo "INSTALLED VERSIONS:"
          npm ls @react-router/dev react-router vite

      - name: Build React project
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/client

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
